        // Randomize questions/options logic
        const shuffleArray = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        const TopBar = ({ score, hearts, streak, mode, onExit }) => (

            const stages = [
                { name: "คุชิดะ คิเคียว", title: "Lv.1 Seedling", img: "https://cdn.myanimelist.net/images/characters/13/333604.jpg" },

                { name: "ร็อกซี่ มิเกอร์เดีย", title: "Lv.4 Tree", img: "https://cdn.myanimelist.net/images/characters/13/427926.jpg" },
                { name: "อาเรีย (Alya)", title: "Lv.Max Master", img: "https://cdn.myanimelist.net/images/characters/14/535496.jpg" }
            ];
            
            return (
                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 text-center relative overflow-hidden group">
                    <div className="absolute top-0 right-0 p-3 opacity-20 group-hover:opacity-100 transition-opacity"><i className="fa-solid fa-heart text-primary"></i></div>
                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">Waifu Evolution System</h3>
                    
                    {/* Waifu Avatar Circle */}
                    <div className="w-32 h-32 mx-auto rounded-full overflow-hidden border-4 border-primary shadow-lg mb-4 animate-bounce-in relative bg-slate-100">
                        <img 
                            src={stages[level-1].img} 
                            alt={stages[level-1].name} 
                            className="w-full h-full object-cover"
                            onError={(e) => { e.target.src = 'https://ui-avatars.com/api/?name=Waifu&background=3b82f6&color=fff&size=128' }}
                        />
                    </div>
                    
                    <div className="font-bold text-xl text-slate-800">{stages[level-1].name}</div>
                    <div className="text-xs font-bold text-primary mb-2">{stages[level-1].title}</div>

                    <div className="w-full bg-slate-100 h-2 rounded-full mt-3 overflow-hidden">
                        <div className="bg-primary h-full transition-all duration-1000" style={{width: `${level === 5 ? 100 : ((expPoints % 15) / 15) * 100}%`}}></div>
                    </div>

        };

        const App = () => {
            const [savedExp, setSavedExp] = useState(parseInt(localStorage.getItem('quizExpWaifu')) || 0);
            const [bookmarks, setBookmarks] = useState(JSON.parse(localStorage.getItem('quizBookmarksWaifu')) || []);
            const [wrongLog, setWrongLog] = useState(JSON.parse(localStorage.getItem('quizWrongLogWaifu')) || []);

            const [screen, setScreen] = useState('menu');
            const [mode, setMode] = useState('normal');
            const [questionSet, setQuestionSet] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [bestStreak, setBestStreak] = useState(0);
            const [hearts, setHearts] = useState(3);
            const [showExp, setShowExp] = useState(false);
            const [qStatus, setQStatus] = useState(null);

            const updateExp = (points) => {
                const newExp = savedExp + points;
                setSavedExp(newExp);
                localStorage.setItem('quizExpWaifu', newExp);
            };
            const toggleBookmark = (id) => {
                let newB = [...bookmarks];
                if(newB.includes(id)) newB = newB.filter(b => b !== id);
                else newB.push(id);
                setBookmarks(newB);
                localStorage.setItem('quizBookmarksWaifu', JSON.stringify(newB));
            };
            const logWrong = (id) => {
                let newW = [...wrongLog];
                if(!newW.includes(id)) {
                    newW.push(id);
                    localStorage.setItem('quizWrongLogWaifu', JSON.stringify(newW));
                    setWrongLog(newW);
                }
            };

            const startGame = (selectedMode, filterType) => {
                sounds.click();
                let qs = [...rawQuizData];
                
                if (filterType === 'mcq') qs = qs.filter(q => q.type === 'mcq');
                if (filterType === 'short') qs = qs.filter(q => q.type === 'short');
                if (filterType === 'bookmark') qs = qs.filter(q => bookmarks.includes(q.id));
                if (filterType === 'wrong') qs = qs.filter(q => wrongLog.includes(q.id));

                if (qs.length === 0) {
                    alert("ไม่มีข้อสอบในหมวดนี้!");
                    return;
                }

                qs = shuffleArray(qs).map(q => {
                    if (q.type === 'mcq') {
                        let mappedOpts = q.options.map((text, idx) => ({ text, originalIdx: idx }));
                        mappedOpts = shuffleArray(mappedOpts);
                        const newCorrectAns = mappedOpts.findIndex(opt => opt.originalIdx === q.ans);
                        return { ...q, options: mappedOpts.map(o => o.text), ans: newCorrectAns };
                    }
                    return q;
                });

                if(selectedMode === 'speed') qs = qs.slice(0, 10);

                setQuestionSet(qs);
                setMode(selectedMode);
                setCurrentIdx(0);
                setAnswers({});
                setScore(0);
                setStreak(0);
                setBestStreak(0);
                setHearts(3);
                setShowExp(false);
                setQStatus(null);
                setScreen('playing');
            };

            const finishGame = () => {
                if(score > questionSet.length * 0.7) {
                    sounds.win();
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                } else {
                    sounds.lose();
                }
                setScreen('result');
            };

            const handleMCQAnswer = (selectedIdx) => {
                if (qStatus !== null) return;
                const q = questionSet[currentIdx];
                const isCorrect = selectedIdx === q.ans;
                processAnswer(isCorrect, selectedIdx);
            };

            const handleShortAnswerSelfCheck = (isCorrect) => {
                processAnswer(isCorrect, isCorrect ? "ถูก" : "ผิด");
            };

            const processAnswer = (isCorrect, recordedAnswer) => {
                const q = questionSet[currentIdx];
                setAnswers({...answers, [currentIdx]: recordedAnswer});
                
                if (isCorrect) {
                    sounds.correct();
                    setQStatus('correct');
                    setScore(s => s + 1);
                    setStreak(s => {
                        const newS = s + 1;
                        if(newS > bestStreak) setBestStreak(newS);
                        return newS;
                    });
                    updateExp(1);
                    if(wrongLog.includes(q.id)) {
                        const newW = wrongLog.filter(id => id !== q.id);
                        setWrongLog(newW);
                        localStorage.setItem('quizWrongLogWaifu', JSON.stringify(newW));
                    }
                } else {
                    sounds.wrong();
                    setQStatus('wrong');
                    setStreak(0);
                    logWrong(q.id);
                    if (mode === 'survival') {
                        setHearts(h => {
                            if (h - 1 <= 0) setTimeout(() => finishGame(), 1500);
                            return h - 1;
                        });
                    }
                }
                setShowExp(true);
            };

            const nextQuestion = () => {
                sounds.click();
                if (currentIdx < questionSet.length - 1 && (mode !== 'survival' || hearts > 0)) {
                    setCurrentIdx(currentIdx + 1);
                    setShowExp(false);
                    setQStatus(null);
                } else {
                    finishGame();
                }
            };

            const getMomentumClass = () => {
                if(streak >= 10) return 'momentum-glow-3';
                if(streak >= 5) return 'momentum-glow-2';
                if(streak >= 3) return 'momentum-glow-1';
                if(streak > 0) return 'momentum-glow-0';
                return 'bg-slate-300';
            };

            if (screen === 'menu') {
                return (
                    <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto flex flex-col justify-center items-center">
                        <div className="text-center mb-10 animate-bounce-in">
                            <h1 className="text-4xl md:text-6xl font-extrabold text-slate-800 mb-3 tracking-tight">Exam<span className="text-primary">Master</span>.</h1>
                            <p className="text-slate-500 font-medium text-lg">ข้อสอบอเมริกาใต้ 100% ครบทุก Section</p>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6 w-full">
                            <div className="md:col-span-1 space-y-6">
                                <WaifuEvolution expPoints={savedExp} />
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col gap-3">
                                    <button onClick={() => startGame('normal', 'bookmark')} className="w-full flex justify-between items-center bg-amber-50 text-amber-700 p-4 rounded-xl font-bold hover:bg-amber-100 transition border border-amber-100">
                                        <span><i className="fa-solid fa-bookmark mr-2"></i>Bookmarks</span>
                                        <span className="bg-white px-2 py-1 rounded-md text-sm">{bookmarks.length}</span>
                                    </button>
                                    <button onClick={() => startGame('normal', 'wrong')} className="w-full flex justify-between items-center bg-rose-50 text-rose-700 p-4 rounded-xl font-bold hover:bg-rose-100 transition border border-rose-100">
                                        <span><i className="fa-solid fa-book-skull mr-2"></i>Wrong Notes</span>
                                        <span className="bg-white px-2 py-1 rounded-md text-sm">{wrongLog.length}</span>
                                    </button>
                                </div>
                            </div>

                            <div className="md:col-span-2 grid sm:grid-cols-2 gap-4">
                                <div className="glass p-8 rounded-3xl flex flex-col h-full border border-slate-200 hover:border-primary transition group cursor-pointer" onClick={() => startGame('normal', 'all')}>
                                    <div className="text-4xl text-primary mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-graduation-cap"></i></div>
                                    <h3 className="text-2xl font-bold mb-2">Classic Grind</h3>
                                    <p className="text-slate-500 mb-6 flex-grow">ลุยข้อสอบทุกพาร์ท ทั้งกากบาทและข้อเขียน เพื่อสะสม EXP อัปเวลไวฟุ!</p>
                                    <button className="bg-slate-800 text-white w-full py-3 rounded-xl font-bold group-hover:bg-primary transition">Play All</button>
                                </div>

                                <div className="glass p-8 rounded-3xl flex flex-col h-full border border-slate-200 hover:border-danger transition group cursor-pointer" onClick={() => startGame('survival', 'mcq')}>
                                    <div className="text-4xl text-danger mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-heart-pulse"></i></div>
                                    <h3 className="text-2xl font-bold mb-2">Survival MCQ</h3>
                                    <p className="text-slate-500 mb-6 flex-grow">โหมดเฉพาะกากบาท ล้วนๆ ผิดได้แค่ 3 ครั้งเท่านั้น ตื่นเต้นเร้าใจ</p>
                                    <button className="bg-slate-800 text-white w-full py-3 rounded-xl font-bold group-hover:bg-danger transition">Start Survival</button>
                                </div>

                                <div className="glass p-8 rounded-3xl flex flex-col h-full border border-slate-200 hover:border-warning transition group cursor-pointer sm:col-span-2" onClick={() => startGame('normal', 'short')}>
                                    <div className="text-4xl text-warning mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-pen-nib"></i></div>
                                    <h3 className="text-2xl font-bold mb-2">Written Challenge</h3>
                                    <p className="text-slate-500 mb-6">ท้าทายด้วยข้อเขียนล้วนๆ (ใช้ระบบ Self-Check ประเมินตัวเอง)</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'playing') {
                const q = questionSet[currentIdx];
                const isBookmarked = bookmarks.includes(q.id);

                return (
                    <div className="min-h-screen p-4 md:p-8 max-w-4xl mx-auto flex flex-col">
                        <TopBar score={score} hearts={hearts} streak={streak} mode={mode} onExit={() => setScreen('menu')} />

                        <div className="glass rounded-3xl overflow-hidden flex-grow flex flex-col shadow-lg border border-slate-200 animate-bounce-in relative">
                            
                            <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-white/50">
                                <span className="bg-blue-100 text-primary font-bold px-3 py-1 rounded-lg text-sm">{q.topic}</span>
                                <div className="flex items-center gap-4">
                                    <span className="font-bold text-slate-400 text-sm">Question {currentIdx + 1} / {questionSet.length}</span>
                                    <button onClick={() => { sounds.click(); toggleBookmark(q.id); }} className="text-2xl hover:scale-110 transition">
                                        <i className={`fa-${isBookmarked ? 'solid' : 'regular'} fa-bookmark ${isBookmarked ? 'text-warning' : 'text-slate-300'}`}></i>
                                    </button>
                                </div>
                            </div>

                            <div className="p-6 md:p-10 flex-grow overflow-y-auto">
                                <h2 className="text-xl md:text-3xl font-extrabold text-slate-800 mb-8 leading-snug">
                                    {q.q}
                                </h2>

                                {q.type === 'mcq' && (
                                    <div className="space-y-4">
                                        {q.options.map((opt, idx) => {
                                            let btnClass = "option-btn w-full text-left p-5 rounded-2xl border-2 font-bold text-lg flex items-center gap-4 ";
                                            let icon = <span className="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm shrink-0">{String.fromCharCode(65 + idx)}</span>;

                                            if (qStatus) {
                                                if (idx === q.ans) {
                                                    btnClass += "bg-emerald-50 border-emerald-400 text-emerald-900 shadow-sm";
                                                    icon = <span className="w-8 h-8 rounded-full bg-emerald-500 text-white flex flex-center items-center justify-center font-bold shrink-0"><i className="fa-solid fa-check"></i></span>;
                                                } else if (idx === answers[currentIdx]) {
                                                    btnClass += "bg-rose-50 border-rose-400 text-rose-900";
                                                    icon = <span className="w-8 h-8 rounded-full bg-rose-500 text-white flex flex-center items-center justify-center font-bold shrink-0"><i className="fa-solid fa-xmark"></i></span>;
                                                } else {
                                                    btnClass += "border-slate-200 text-slate-400 bg-white opacity-50";
                                                }
                                            } else {
                                                btnClass += "bg-white border-slate-200 text-slate-700 hover:border-primary hover:bg-blue-50 cursor-pointer shadow-sm";
                                            }

                                            return (
                                                <button key={idx} onClick={() => handleMCQAnswer(idx)} className={btnClass} disabled={qStatus !== null}>
                                                    {icon} <span>{opt}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                )}

                                {q.type === 'short' && !qStatus && (
                                    <div className="bg-slate-50 border-2 border-slate-200 border-dashed rounded-2xl p-10 text-center">
                                        <i className="fa-solid fa-brain text-4xl text-slate-300 mb-4"></i>
                                        <h3 className="font-bold text-xl text-slate-600 mb-2">Think of the answer...</h3>
                                        <p className="text-slate-400 mb-6">เขียนลงกระดาษ หรือนึกคำตอบไว้ในใจ แล้วกดปุ่มเพื่อดูเฉลย</p>
                                        <button onClick={() => { sounds.click(); setShowExp(true); setQStatus('checking'); }} className="bg-primary text-white font-bold py-3 px-8 rounded-xl hover:bg-blue-600 shadow-md">
                                            Show Answer
                                        </button>
                                    </div>
                                )}

                                {showExp && (
                                    <div className="mt-8 animate-bounce-in">
                                        {q.type === 'short' && qStatus === 'checking' && (
                                            <div className="bg-white border-2 border-primary rounded-2xl p-6 mb-6 shadow-md text-center">
                                                <h3 className="font-bold text-slate-500 mb-2 uppercase text-sm">Correct Answer:</h3>
                                                <p className="text-xl font-bold text-slate-800 mb-6">{q.ans}</p>
                                                <div className="font-bold text-slate-600 mb-4">คุณตอบถูกหรือไม่? (ประเมินตัวเอง)</div>
                                                <div className="flex gap-4 justify-center">
                                                    <button onClick={() => handleShortAnswerSelfCheck(true)} className="flex-1 bg-emerald-500 text-white font-bold py-3 rounded-xl hover:bg-emerald-600 shadow-md"><i className="fa-solid fa-check mr-2"></i> ตอบถูก</button>
                                                    <button onClick={() => handleShortAnswerSelfCheck(false)} className="flex-1 bg-rose-500 text-white font-bold py-3 rounded-xl hover:bg-rose-600 shadow-md"><i className="fa-solid fa-xmark mr-2"></i> ตอบผิด</button>
                                                </div>
                                            </div>
                                        )}

                                        {qStatus !== 'checking' && (
                                            <div className={`p-6 rounded-2xl border-l-4 ${qStatus === 'correct' ? 'bg-emerald-50 border-emerald-500' : 'bg-rose-50 border-rose-500'}`}>
                                                <div className="flex items-center gap-2 font-bold mb-3 text-lg">
                                                    {qStatus === 'correct' ? <span className="text-emerald-700"><i className="fa-solid fa-circle-check mr-2"></i>Correct! รับ EXP สำหรับ Waifu ของคุณ</span> : <span className="text-rose-700"><i className="fa-solid fa-circle-xmark mr-2"></i>Incorrect! ไม่เป็นไร จำไว้ใช้ในห้องสอบนะ</span>}
                                                </div>
                                                
                                                <div className="bg-white p-4 rounded-xl border border-white/50 text-slate-700 leading-relaxed shadow-sm">
                                                    <span className="font-bold text-slate-900 border-b-2 border-primary pb-1 inline-block mb-2">คำอธิบาย:</span><br/>
                                                    {q.exp}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="bg-slate-50 border-t border-slate-200 p-4 flex items-center justify-between">
                                <div className="flex-grow mr-6">
                                    <div className="text-xs font-bold text-slate-400 uppercase mb-1">Momentum Bar {streak > 2 && <span className="text-primary float-right">Combo x{streak}</span>}</div>
                                    <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                        <div className={`h-full transition-all duration-500 ${getMomentumClass()}`} style={{width: `${Math.min((streak/10)*100, 100)}%`}}></div>
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={nextQuestion}
                                    disabled={!qStatus || qStatus === 'checking'}
                                    className={`px-8 py-3 rounded-xl font-bold text-white transition-all flex items-center gap-2 ${
                                        (!qStatus || qStatus === 'checking') ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-900 shadow-md transform hover:-translate-y-1'
                                    }`}
                                >
                                    {currentIdx === questionSet.length - 1 || (mode === 'survival' && hearts === 0) ? 'Finish' : 'Next'} <i className="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'result') {
                const percentage = Math.round((score / questionSet.length) * 100);
                let rank = "Beginner";
                let badgeColor = "text-slate-400";
                let badgeIcon = "fa-medal";
                
                if (percentage === 100) { rank = "Master"; badgeColor = "text-purple-500"; badgeIcon = "fa-crown"; }
                else if (percentage >= 80) { rank = "Gold"; badgeColor = "text-yellow-400"; }
                else if (percentage >= 60) { rank = "Silver"; badgeColor = "text-slate-300"; }
                else if (percentage >= 40) { rank = "Bronze"; badgeColor = "text-amber-600"; }

                return (
                    <div className="min-h-screen p-4 md:p-8 flex items-center justify-center">
                        <div className="glass max-w-2xl w-full p-8 md:p-12 rounded-3xl text-center border-t-8 border-primary shadow-xl animate-bounce-in">
                            <h2 className="text-3xl font-extrabold text-slate-800 mb-2">Quiz Completed!</h2>
                            <p className="text-slate-500 mb-8 font-medium">Mode: {mode.toUpperCase()}</p>
                            
                            <div className="flex justify-center items-center gap-8 mb-8">
                                <div className="text-center">
                                    <div className="text-6xl font-black text-primary">{score}<span className="text-2xl text-slate-400">/{questionSet.length}</span></div>
                                    <div className="text-sm font-bold text-slate-400 uppercase mt-2">Score</div>
                                </div>
                                <div className="h-16 w-px bg-slate-200"></div>
                                <div className="text-center">
                                    <div className={`text-6xl ${badgeColor}`}><i className={`fa-solid ${badgeIcon}`}></i></div>
                                    <div className="text-sm font-bold text-slate-400 uppercase mt-2">Rank: {rank}</div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <div className="text-slate-400 text-xs font-bold uppercase mb-1">Best Streak</div>
                                    <div className="text-2xl font-bold text-warning"><i className="fa-solid fa-fire mr-2"></i>{bestStreak}</div>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <div className="text-slate-400 text-xs font-bold uppercase mb-1">Accuracy</div>
                                    <div className="text-2xl font-bold text-primary"><i className="fa-solid fa-bullseye mr-2"></i>{percentage}%</div>
                                </div>
                            </div>

                            {percentage < 100 && (
                                <div className="bg-rose-50 text-rose-700 p-4 rounded-xl mb-8 font-medium text-sm">
                                    <i className="fa-solid fa-lightbulb mr-2"></i>ข้อที่ตอบผิดถูกบันทึกลงใน <b className="font-bold">Wrong Notes</b> แล้ว กลับไปทบทวนได้ที่หน้าแรก
                                </div>
                            )}

                            <button onClick={() => { sounds.click(); setScreen('menu'); }} className="bg-slate-800 text-white font-bold text-lg py-4 px-12 rounded-xl hover:bg-slate-900 transition-all shadow-lg transform hover:-translate-y-1 w-full sm:w-auto">
                                <i className="fa-solid fa-house mr-2"></i> Back to Menu
                            </button>
                        </div>
                    </div>
                );
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
