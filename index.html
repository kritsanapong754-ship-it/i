<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate IQ Test 💀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        /* Images */
        .image-box {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #000;
            position: relative;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Typography */
        h2 {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Input */
        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        /* Button */
        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background: #2563eb;
        }

        /* Toast Notification */
        .toast {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            top: 20px;
            opacity: 1;
        }

        /* Results Screen */
        .hidden {
            display: none !important;
        }

        .result-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--success);
            margin-bottom: 10px;
        }

        .result-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .answer-reveal {
            background: #0f172a;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            opacity: 0;
            transform: translateX(-50px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .answer-reveal.show-motion {
            opacity: 1;
            transform: translateX(0);
        }

        .q-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .a-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; filter: blur(5px); }
            to { opacity: 1; filter: blur(0); }
        }
    </style>
</head>
<body>

    <!-- Quiz Container -->
    <div class="container" id="quiz-screen">
        <div class="toast" id="toast">✅ Correct! (Genius)</div>
        
        <div class="image-box">
            <!-- ตั้งชื่อไฟล์รูปให้ตรงกับตรงนี้ -->
            <img id="q-img" src="pic1.jpg" alt="Question Image" onerror="this.src='https://via.placeholder.com/500x250?text=pic1.jpg'">
        </div>
        
        <h2 id="q-title">Who’s actually better than LeBron, tho?</h2>
        
        <form id="q-form">
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Type your answer here, fr..." required autocomplete="off">
            </div>
            <button type="submit">Submit Answer 🚀</button>
        </form>
    </div>

    <!-- Results Container -->
    <div class="container hidden" id="result-screen">
        <div class="image-box">
            <img src="ans.jpg" alt="Result Image" onerror="this.src='https://via.placeholder.com/500x250?text=ans.jpg'">
        </div>
        
        <h1 class="result-title">100% CORRECT 🎉</h1>
        <p class="result-subtitle">Here are the undisputed facts:</p>

        <div id="answers-container">
            <!-- คำตอบจะถูกสร้างและเด้งขึ้นมาที่นี่ -->
        </div>
    </div>

    <script>
        // ข้อมูลคำถามและคำตอบที่ตกลงกันไว้
        const quizData = [
            {
                q: "1. Who’s actually better than LeBron, tho?",
                img: "pic1.jpg",
                realAns: "Me. 💀"
            },
            {
                q: "2. Who’s the smartest person alive, fr?",
                img: "pic2.jpg",
                realAns: "IDK."
            },
            {
                q: "3. Who decided pineapple belongs on pizza, tho?",
                img: "pic3.jpg",
                realAns: "Everyone except me and Italians. 💀"
            },
            {
                q: "4. Yo, you ever eat a hot dog?",
                img: "pic4.jpg",
                realAns: "Nah, I’ve never eaten a"
            },
            {
                q: "5. Aight, who’s better, Ronaldo or Messi?",
                img: "pic5.jpg",
                realAns: "Me. 🐐" // เพิ่มเฉลยข้อ 5 ให้เข้ากับธีม
            }
        ];

        let currentIndex = 0;

        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const qTitle = document.getElementById('q-title');
        const qImg = document.getElementById('q-img');
        const userInput = document.getElementById('user-input');
        const qForm = document.getElementById('q-form');
        const toast = document.getElementById('toast');
        const answersContainer = document.getElementById('answers-container');

        // โหลดข้อแรก
        loadQuestion();

        qForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // ไม่ว่าพิมพ์อะไรมา ให้โชว์ว่า "ถูกต้อง" เสมอ
            showToast();

            // หน่วงเวลาให้เห็นป๊อปอัพว่าตอบถูกแป๊บนึง แล้วเปลี่ยนข้อ
            setTimeout(() => {
                currentIndex++;
                
                if (currentIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 800);
        });

        function loadQuestion() {
            // อัปเดตคำถามและรูปภาพ
            const currentData = quizData[currentIndex];
            qTitle.innerText = currentData.q;
            qImg.src = currentData.img;
            userInput.value = ''; // ล้างช่องพิมพ์
            userInput.focus();
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 700);
        }

        function showResults() {
            // ซ่อนหน้าคำถาม โชว์หน้าสรุปผล
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            // สร้าง Element สำหรับเฉลยทีละข้อ
            quizData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'answer-reveal';
                div.innerHTML = `
                    <div class="q-text">${item.q}</div>
                    <div class="a-text">➔ ${item.realAns}</div>
                `;
                answersContainer.appendChild(div);

                // ตั้งเวลาให้เด้งขึ้นมาทีละข้อ (Motion Effect) ข้อละ 0.4 วินาที
                setTimeout(() => {
                    div.classList.add('show-motion');
                }, 300 + (index * 400));
            });
        }
    </script>
</body>
</html>
